name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            artifact: YT-Music-Downloader-Windows
          - os: macos-latest
            name: macOS
            artifact: YT-Music-Downloader-macOS
          - os: ubuntu-latest
            name: Linux
            artifact: YT-Music-Downloader-Linux

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg python3-tk python3-pil python3-pil.imagetk

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install ffmpeg -y
          refreshenv

      # --upgrade ist wichtig: yt-dlp wird hier fest ins Fertigprogramm gepackt
      # und kann sich danach nicht mehr selbst erneuern. Kommt eine alte
      # Fassung mit, liefert YouTube schon nach wenigen Wochen 403er.
      - name: Install Python dependencies
        run: pip install --upgrade customtkinter yt-dlp Pillow requests mutagen pyinstaller

      # Im Nachhinein ist sonst nicht feststellbar, welche yt-dlp-Fassung in
      # einem Release steckt – genau die Frage bei jedem 403-Bericht.
      - name: Record yt-dlp version
        shell: bash
        run: |
          YTDLP=$(python -c "import yt_dlp; print(yt_dlp.version.__version__)")
          echo "Eingepackt: yt-dlp $YTDLP"
          echo "- **${{ matrix.name }}**: yt-dlp \`$YTDLP\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Find FFmpeg path (Unix)
        if: runner.os != 'Windows'
        id: ffmpeg_unix
        shell: bash
        run: |
          FFMPEG_PATH=$(which ffmpeg)
          FFMPEG_DIR=$(dirname "$FFMPEG_PATH")
          echo "dir=$FFMPEG_DIR" >> "$GITHUB_OUTPUT"
          echo "FFmpeg found at: $FFMPEG_DIR"

      - name: Find FFmpeg path (Windows)
        if: runner.os == 'Windows'
        id: ffmpeg_win
        shell: powershell
        run: |
          # (Get-Command ffmpeg).Source liefert den Chocolatey-Platzhalter: ein
          # ~380 KB großes Startprogramm, das auf die echte Datei im
          # Chocolatey-Ordner verweist. Eingepackt ist er wertlos, weil dieser
          # Ordner auf fremden Rechnern fehlt. Also die echte Datei suchen.
          $echt = Get-ChildItem "C:\ProgramData\chocolatey\lib" -Recurse -Filter ffmpeg.exe -ErrorAction SilentlyContinue |
                  Where-Object { $_.Length -gt 10MB } |
                  Sort-Object Length -Descending | Select-Object -First 1
          if (-not $echt) { throw "Kein echtes ffmpeg.exe gefunden - nur Platzhalter?" }
          $ffmpegDir = $echt.DirectoryName
          echo "dir=$ffmpegDir" >> $env:GITHUB_OUTPUT
          echo "FFmpeg found at: $ffmpegDir ($([math]::Round($echt.Length/1MB)) MB)"

      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        working-directory: YT-MP3-Downloader-main
        shell: bash
        run: |
          FFMPEG_DIR="${{ steps.ffmpeg_win.outputs.dir }}"
          python -m PyInstaller --onefile --noconsole \
            --name "YTMusicDownloader" \
            --paths . \
            --icon temp_icon.ico \
            --hidden-import="PIL" \
            --hidden-import="PIL._tkinter_finder" \
            --hidden-import="PIL._imagingtk" \
            --hidden-import="tkinter" \
            --collect-all customtkinter \
            --add-binary "$FFMPEG_DIR/ffmpeg.exe;." \
            --add-binary "$FFMPEG_DIR/ffprobe.exe;." \
            --add-data "temp_icon.ico;." \
            --add-data "icon.png;." \
            main.py

      - name: Build with PyInstaller (macOS)
        if: runner.os == 'macOS'
        working-directory: YT-MP3-Downloader-main
        run: |
          pyinstaller --onefile --noconsole \
            --name "YTMusicDownloader" \
            --paths . \
            --hidden-import="PIL" \
            --hidden-import="PIL._tkinter_finder" \
            --hidden-import="PIL._imagingtk" \
            --hidden-import="tkinter" \
            --collect-all customtkinter \
            --add-binary "${{ steps.ffmpeg_unix.outputs.dir }}/ffmpeg:." \
            --add-binary "${{ steps.ffmpeg_unix.outputs.dir }}/ffprobe:." \
            --add-data "temp_icon.ico:." \
            --add-data "icon.png:." \
            main.py

      - name: Build with PyInstaller (Linux)
        if: runner.os == 'Linux'
        working-directory: YT-MP3-Downloader-main
        run: |
          pyinstaller --onefile --noconsole \
            --name "YTMusicDownloader" \
            --paths . \
            --hidden-import="PIL" \
            --hidden-import="PIL._tkinter_finder" \
            --hidden-import="PIL._imagingtk" \
            --hidden-import="tkinter" \
            --collect-all customtkinter \
            --add-binary "${{ steps.ffmpeg_unix.outputs.dir }}/ffmpeg:." \
            --add-binary "${{ steps.ffmpeg_unix.outputs.dir }}/ffprobe:." \
            --add-data "temp_icon.ico:." \
            --add-data "icon.png:." \
            main.py

      # PyInstaller meldet auch dann Erfolg, wenn seine Import-Analyse `ytmd`
      # nicht gefunden hat - das Programm bricht dann erst beim Nutzer ab.
      # Genau so gingen v1.4.3 und v1.4.4 als startunfaehige Binaries raus.
      - name: Verify bundle is complete
        shell: bash
        working-directory: YT-MP3-Downloader-main
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            PROGRAMM="dist/YTMusicDownloader.exe"
          else
            PROGRAMM="dist/YTMusicDownloader"
          fi
          python ../tools/verify_bundle.py "$PROGRAMM"

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Compress-Archive -Path "YT-MP3-Downloader-main/dist/YTMusicDownloader.exe" -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Package artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          cd YT-MP3-Downloader-main/dist
          zip "../../${{ matrix.artifact }}.zip" YTMusicDownloader

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifact }}.zip

  android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk \
             YT-Music-Downloader-Android.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android
          path: YT-Music-Downloader-Android.apk

  release:
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Windows/*.zip
            macOS/*.zip
            Linux/*.zip
            Android/*.apk
